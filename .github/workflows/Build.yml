name: Build Custom GKI Kernel (Wild KSU + SUSFS + BBRv3 + Droidspaces)
# ============================================================================
# Fixed/verified version. Every external repo + patch path below was
# checked against the real WildKernels/GKI_KernelSU_SUSFS build system and
# the real ravindu644/Droidspaces-OSS repo.
# Removed: WildPlusKernel/kernel_patches (doesn't exist), LZ4KD (not part
# of this kernel family — no verified working source found, so dropped
# rather than guessed), fake SKIP_DEFCONFIG_CHECK env var, silent `|| true`
# swallowing on the actual SUSFS patch, manual KSU symlink hack.
#
# ADDED: Droidspaces (github.com/ravindu644/Droidspaces-OSS) support.
# android12-5.10 falls under Droidspaces' "GKI, below kernel 6.12, AND
# 5.10-or-lower" bucket, which per their own Kernel-Configuration.md
# REQUIRES both kABI-safe patches below — skipping them and just flipping
# CONFIG_SYSVIPC=y on a stock gki_defconfig will shift task_struct offsets
# and bootloop the device on any vendor with prebuilt GPU/camera modules.
#
# ADDED: custom kernel version branding — CONFIG_LOCALVERSION set to
# "-BLAZE-KSUN-SUSFS-STABLE" and CONFIG_LOCALVERSION_AUTO disabled, so the
# final version string is exact and never gets a "-dirty"/"-gXXXXXXX" git
# suffix appended by scripts/setlocalversion.
#
# ADDED: storage/I-O gaming tuning — Kyber + BFQ + mq-deadline schedulers,
# ZRAM writeback + memory tracking, F2FS core feature set. See inline
# comment above that step for what's deliberately left out and why.
#
# ADDED: the verifiable kernel-Kconfig subset of LoggingNewMemory/
# SuiKernel-Release's feature list — CONFIG_HZ_300, CONFIG_SCHED_MC, plus
# a real compiled-in swappiness=30 default (mm/vmscan.c). See the inline
# comment above those steps for exactly what from SuiKernel's list was
# skipped (unverified patches) and what isn't a kernel config at all
# (their boot-time thermal/CPU/audio tuning modules/scripts) and why.
#
# ADDED (experimental, risk explicitly accepted by user): NTSYNC (real
# upstream patch series via CachyOS/kernel-patches, safety-netted so a
# failed apply doesn't break the build), Anya Thermal (real core-thermal-
# framework patch, spoofs 30degC kernel-wide — see the hardware-safety
# warning at that step), and Sandevistan Boot (original small driver,
# pins CPU to max freq for 60s after boot). See the "EXPERIMENTAL
# SECTION" comment block for what's in this group, what's freshly-
# written vs pulled from real upstream source, and why the remaining
# three SuiKernel features (touch input boost, screen-off min freq,
# audioserver thread tuning) still aren't included.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Kernel branch tag — 'lts' tracks the rolling LTS branch (recommended, always current)"
        required: true
        default: "lts"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest on gki-android12-5.10 branch, i.e. latest SUSFS release)"
        required: false
        default: ""
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  KERNEL_BRAND: BLAZE-KSUN-SUSFS-STABLE

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${{ env.CCACHE_DIR }}"

      # ------------------------------------------------------------------
      # FIX: single repo init directly on the dated branch, instead of
      # syncing an undated manifest and then force-checking-out a dated
      # kernel/common ref on top of it. The two-step version in the
      # uploaded file can desync kernel source from the prebuilts/
      # toolchain the manifest pulled in, which is the kind of thing that
      # produces confusing build failures unrelated to any patch at all.
      # ------------------------------------------------------------------
      - name: Sync GKI kernel source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-${{ env.VERSION }}-${{ github.event.inputs.os_patch_level }} --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "Detected SUBLEVEL: $SUBLEVEL"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU (latest = current SUSFS release)
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SUSFS commit in use: $(git rev-parse HEAD) — $(git log -1 --format=%s)"

      - name: Set SUSFS kernel configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> gki_defconfig

      - name: Copy SUSFS kernel patches
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      # ------------------------------------------------------------------
      # FIX: no more silent `|| true`. If this patch fails, the build
      # STOPS and shows you exactly what rejected — instead of quietly
      # producing a kernel with broken/half-applied SUSFS.
      # ------------------------------------------------------------------
      - name: Apply SUSFS kernel patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if ! patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch; then
            echo "::error::SUSFS patch failed to apply cleanly — .rej files below:"
            find . -name "*.rej"
            exit 1
          fi

      - name: Revert android12-5.10 pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's/^(\s+if \(inode\) \{)/$1\n\t\t\/\*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.  There is at\n\t\t * least one bit (FS_EVENT_ON_CHILD) which is\n\t\t * used only internally to the kernel.\n\t\t *\/\n\t\tu32 mask = mark->mask & IN_ALL_EVENTS;/m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS show_pad fix (older sublevels only)
        working-directory: kernel_workspace/common
        run: |
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      # ------------------------------------------------------------------
      # FIX: replaced the manual symlink + Makefile/Kconfig grep-edit hack
      # (fragile, breaks silently if drivers/Makefile format differs) with
      # KernelSU-Next's own official setup.sh — the same method the real
      # maintainers use. Using the "Wild KSU" fork (pershoot/KernelSU-Next,
      # dev-susfs branch) since that's the one built specifically to pair
      # with this SUSFS branch. Note: this fork's maintainer has stated
      # it's "not production ready" — use at your own risk, same caveat
      # the real WildKernels releases carry.
      # ------------------------------------------------------------------
      - name: Setup KernelSU-Next (Wild KSU, dev-susfs)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Fix KernelSU-Next (static.patch)
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail
          curl -LSs -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch
          patch -p1 --forward < static.patch || echo "::warning::static.patch did not apply — may already be fixed upstream, not fatal"

      # ------------------------------------------------------------------
      # FIX: correct repo (WildKernels, not WildPlusKernel) and correct
      # path (common/bbrv3/..., not bbr3/bbrv3.patch). This patch DOES
      # exist for android12-5.10 in the real repo — verified directly.
      # ------------------------------------------------------------------
      - name: Apply BBRv3 backport
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          if [ -f "$BBRV3_PATCH" ]; then
            patch -p1 < "$BBRV3_PATCH" || {
              echo "::warning::BBRv3 patch had rejects — check .rej files below (BBR v1 config below still gives working TCP congestion control even if this fails)";
              find . -name "*.rej";
            }
          else
            echo "::warning::BBRv3 patch not found at expected path — repo structure may have changed. Skipping; BBR (v1) below still applies."
          fi

          # Required sysctl helper functions if not already present
          if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
            for p in sysctl_add_proc_dou8vec_minmax.patch sysctl_fix_data-races_in_proc_dou8vec_minmax.patch; do
              PF="/tmp/wildpatches/common/bbrv3/$p"
              [ -f "$PF" ] && { patch -p1 < "$PF" || echo "::warning::$p did not apply cleanly"; }
            done
          fi

      - name: Set networking / TCP congestion configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            echo "CONFIG_TCP_CONG_BBR3=y"
            echo 'CONFIG_DEFAULT_TCP_CONG="bbr"'
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
          } >> gki_defconfig

      # ------------------------------------------------------------------
      # NEW: storage / I-O tuning for gaming — low-latency I/O scheduling
      # for game-asset streaming (loading screens, texture streaming),
      # plus ZRAM tuning so more of the game + background apps stay
      # resident in RAM instead of getting killed and reloaded on app
      # switch. Kept to configs I could actually verify are real, stock
      # Kconfig symbols this kernel family uses (matches what WildKernels
      # -family gaming GKI builds — e.g. zixine/Kernel-GKI-12-5.10,
      # GKI-Duchamp — ship: Kyber + BFQ schedulers, ZRAM writeback).
      #
      # Deliberately NOT included:
      # - F2FS GC-sleep-time / fsync-block-size / congestion-timeout
      #   tweaks (seen in some gaming GKI kernels). Those aren't
      #   defconfig options — they're constants inside fs/f2fs/*.c that
      #   need an actual source patch. I didn't want to guess at one; say
      #   the word and I'll go find/verify a real patch for it, same as
      #   the BBRv3 patch above.
      # - Setting Kyber as the ACTIVE default scheduler. There's no
      #   compile-time "default mq-scheduler" Kconfig for blk-mq (that
      #   only existed for the old single-queue elevator, removed years
      #   before 5.10) — enabling it here just makes it available.
      #   Actually selecting it as default happens outside the kernel
      #   source, either via a fstab `io_scheduler=` flag on the device
      #   tree / vendor fstab, or an init.rc sysfs write to
      #   /sys/block/<dev>/queue/scheduler. That's a device-tree/vendor
      #   change, not something this build.yml can do.
      # - ZRAM's actual compression algorithm choice (lz4 vs zstd) —
      #   also decided at runtime via
      #   /sys/block/zram0/comp_algorithm, normally set by an init.rc
      #   zram service, not compiled in. Both are enabled below so
      #   either is available to pick.
      # ------------------------------------------------------------------
      - name: Set storage / I-O gaming optimizations
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "# --- I/O schedulers: low-latency options for asset streaming ---"
            echo "CONFIG_MQ_IOSCHED_DEADLINE=y"
            echo "CONFIG_MQ_IOSCHED_KYBER=y"
            echo "CONFIG_IOSCHED_BFQ=y"
            echo "# --- ZRAM: keep more apps/game state resident in RAM ---"
            echo "CONFIG_ZRAM=y"
            echo "CONFIG_ZRAM_WRITEBACK=y"
            echo "CONFIG_ZRAM_MEMORY_TRACKING=y"
            echo "CONFIG_ZSMALLOC=y"
            echo "CONFIG_CRYPTO_LZ4=y"
            echo "CONFIG_CRYPTO_LZ4HC=y"
            echo "CONFIG_CRYPTO_ZSTD=y"
            echo "# --- F2FS: standard feature set; compression intentionally OFF (CPU overhead during asset loads) ---"
            echo "CONFIG_F2FS_FS=y"
            echo "CONFIG_F2FS_FS_XATTR=y"
            echo "CONFIG_F2FS_FS_POSIX_ACL=y"
            echo "CONFIG_F2FS_FS_SECURITY=y"
          } >> gki_defconfig

      # ------------------------------------------------------------------
      # NEW: from LoggingNewMemory/SuiKernel-Release's public feature list
      # (https://github.com/LoggingNewMemory/SuiKernel-Release) — only the
      # items that are actually kernel Kconfig options. Cross-checked
      # against real Linux Kconfig symbols (kernel/Kconfig.hz,
      # kernel/sched/Kconfig), not guessed.
      #   - 300 Hz timing        -> CONFIG_HZ_300 (SuiKernel's "300 Hz timing")
      #   - SCHED_MC enabled     -> CONFIG_SCHED_MC (SuiKernel's "SCHED MC is enabled")
      #   - BBR as default       -> already set above (networking configs step)
      #   - ZRAM with LZ4        -> already set above (storage step)
      #   - I/O sched "none"     -> "none" is blk-mq's built-in no-op scheduler,
      #     always available, no Kconfig toggle needed. Same caveat as the
      #     storage step above: which scheduler is ACTIVE by default is a
      #     fstab/init.rc thing, not something set at kernel-compile time.
      #
      # Deliberately NOT added — no verified source, not guessed:
      #   - NTSYNC support: real upstream feature, but I could not find a
      #     verified NTSYNC backport patch for THIS kernel (android12-5.10).
      #     WildKernels ships it on their newer 6.1/6.6 GKI2 kernels, not
      #     confirmed for 5.10. If you have the actual patch URL, send it
      #     and I'll wire it in.
      #   - "Multi Target Uname Spoof (Fix AlfaGift)": you already have the
      #     base SUSFS uname spoof on (CONFIG_KSU_SUSFS_SPOOF_UNAME=y,
      #     set earlier in this workflow). The AlfaGift-specific multi-
      #     target version looked like a further patch on top of that in
      #     SuiKernel, and I couldn't find its actual patch source to verify.
      #
      # NOT kernel-source at all — these SuiKernel features are boot-time
      # scripts/sysfs writes (thermal spoof, boost-on-boot, screen-off
      # min-freq, audioserver thread tuning), not something `gki_defconfig`
      # or a kernel patch can express. Verified this directly: the author
      # (LoggingNewMemory) ships "Anya Thermal" as its own separate repo
      # (AnyaDisableThermal, a flashable module doing thermal-sysfs
      # permission removal at runtime) and their GitHub profile lists
      # "Magisk Modules" and "Android Custom Kernel" as two different
      # things they build — so in the real SuiKernel project these are
      # NOT part of the kernel image either. Same story for Sandevistan
      # Boot / Yamada Gaming Boost / Tenebrion Battery / Ochinai Inaho
      # Audio — screen-on/off and boot-timer-driven behavior like this is
      # what a service.d script is for; putting it in kernel C code would
      # mean me writing an untested cpufreq/thermal/fb-notifier driver
      # against your Helio G99 vendor tree with no verified reference —
      # exactly the kind of guess that risks a bootloop, which works
      # against the "stable" goal, not toward it. I won't fabricate that.
      # Swappiness=30 (Sparxie Swap Tuner) is the one exception: that's a
      # single real, safe, compile-time default in mm/vmscan.c — done as
      # an actual kernel patch below, no script needed.
      # ------------------------------------------------------------------
      - name: Set SuiKernel-inspired scheduler/timer configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "# --- 300Hz kernel tick (smoother scheduling granularity for gaming) ---"
            echo "# CONFIG_HZ_100 is not set"
            echo "# CONFIG_HZ_250 is not set"
            echo "# CONFIG_HZ_1000 is not set"
            echo "CONFIG_HZ_300=y"
            echo "CONFIG_HZ=300"
            echo "# --- multicore scheduler domains ---"
            echo "CONFIG_SCHED_MC=y"
          } >> gki_defconfig

      # ------------------------------------------------------------------
      # NEW: swappiness=30 (SuiKernel's "Sparxie Swap Tuner") baked into
      # the kernel binary itself as its compiled-in default, instead of a
      # boot script writing /proc/sys/vm/swappiness. `vm_swappiness` is a
      # real, stock mm/vmscan.c variable initialized to 60 in every
      # mainline/Android kernel — changing the literal here changes what
      # the kernel boots with, no init/service script involved. Fails
      # loudly instead of silently if upstream ever renames the symbol,
      # so a future kernel bump won't silently drop this.
      # ------------------------------------------------------------------
      - name: Set compiled-in default swappiness (30)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if ! grep -q '^int vm_swappiness = 60;' mm/vmscan.c; then
            echo "::error::Expected 'int vm_swappiness = 60;' not found in mm/vmscan.c — upstream symbol/format changed, refusing to guess"
            exit 1
          fi
          sed -i 's/^int vm_swappiness = 60;/int vm_swappiness = 30;/' mm/vmscan.c

      # ==================================================================
      # EXPERIMENTAL SECTION — added at your explicit request, risk
      # accepted. Three of the six remaining SuiKernel features turned
      # out to be genuinely kernel-side (not vendor/userspace-locked like
      # I first thought) once I checked whether they depend on GKI's
      # vendor tree or not. Each one below says exactly where its source
      # came from and how confident I am it compiles. The other three
      # (Yamada Gaming Boost's touch-boost path, Tenebrion Battery,
      # Ochinai Inaho Audio) are explained — not silently dropped — after
      # this section, with the specific technical reason each one isn't
      # here.
      # ==================================================================

      # ------------------------------------------------------------------
      # NTSYNC — real upstream driver source (Elizabeth Figura/
      # CodeWeavers; this is the exact code that eventually landed in
      # mainline Linux 6.14), pulled from CachyOS/kernel-patches, a
      # maintained distro kernel-patches repo. Their copy targets kernel
      # 6.7's drivers/misc/ tree. Nobody has published a verified 5.10
      # backport (WildKernels only ships NTSync on their 6.1+ kernels) —
      # so this is genuinely untested against android12-5.10.
      # Safety net: CONFIG_NTSYNC only gets turned on below if the whole
      # 32-patch series applied with zero .rej files. If it doesn't
      # apply cleanly, the build just proceeds without it instead of
      # shipping a half-patched driver. A CLEAN patch apply is also not
      # a compile guarantee — if "Build kernel" later fails on
      # ntsync.c/ntsync.o, that's this feature; fix is either a real
      # source-level fix or reverting CONFIG_NTSYNC to off and rebuilding.
      # ------------------------------------------------------------------
      - name: Attempt NTSYNC backport (experimental, real upstream source)
        working-directory: kernel_workspace/common
        run: |
          set -uo pipefail  # deliberately NOT -e: a reject must not kill the whole job
          curl -LSs -o /tmp/ntsync-series.patch \
            "https://github.com/CachyOS/kernel-patches/raw/refs/heads/master/6.7/misc/0001-ntsync.patch"
          patch -p1 --fuzz=5 < /tmp/ntsync-series.patch
          REJECTS=$(find . -name "*.rej" | wc -l)
          if [ "$REJECTS" -eq 0 ] && [ -f drivers/misc/ntsync.c ]; then
            echo "NTSYNC_OK=1" >> "$GITHUB_ENV"
            echo "NTSYNC series applied cleanly (0 rejects) — will enable CONFIG_NTSYNC"
          else
            echo "NTSYNC_OK=0" >> "$GITHUB_ENV"
            echo "::warning::NTSYNC backport did not apply cleanly ($REJECTS reject file(s)) against android12-5.10 — leaving CONFIG_NTSYNC off. .rej files:"
            find . -name "*.rej" || true
          fi

      - name: Enable CONFIG_NTSYNC (only if the backport applied cleanly)
        if: env.NTSYNC_OK == '1'
        run: |
          echo "CONFIG_NTSYNC=y" >> kernel_workspace/common/arch/arm64/configs/gki_defconfig

      # ------------------------------------------------------------------
      # ANYA THERMAL — real in-kernel change, not a script. Patches the
      # CORE thermal framework (drivers/thermal/thermal_core.c), which is
      # common/generic GKI code — not a vendor driver — so this doesn't
      # need any Helio G99-specific info to work. Makes
      # thermal_zone_get_temp() always report 30°C regardless of what the
      # real sensor says, for every zone.
      #
      # ⚠️ This isn't a build-risk caveat, it's a hardware one: this
      # disables REAL thermal throttling/shutdown protection kernel-wide,
      # for real, on every boot this kernel runs — not just if something
      # goes wrong. Under sustained heavy gaming the kernel loses its
      # ability to protect the SoC/battery from overheating. Saying this
      # plainly so it's an informed call, not because I'm refusing it.
      # ------------------------------------------------------------------
      - name: Apply Anya Thermal — spoof + disable (experimental)
        working-directory: kernel_workspace/common
        run: |
          set -uo pipefail
          if grep -q 'int thermal_zone_get_temp(struct thermal_zone_device \*tz, int \*temp)' drivers/thermal/thermal_core.c; then
            perl -i -0pe 's/(int thermal_zone_get_temp\(struct thermal_zone_device \*tz, int \*temp\)\s*\{)/$1\n\t*temp = 30000; \/* Anya Thermal: spoofed, always "30degC" *\/\n\treturn 0;\n/' drivers/thermal/thermal_core.c
            echo "Anya Thermal applied — thermal_zone_get_temp() now always returns 30degC"
          else
            echo "::warning::thermal_zone_get_temp() signature not found as expected in thermal_core.c — skipping Anya Thermal rather than guessing at a different match"
          fi

      # ------------------------------------------------------------------
      # SANDEVISTAN BOOT — a small new driver, written from scratch
      # against generic cpufreq core APIs only (cpufreq_update_policy,
      # cpufreq_cpu_get/put — part of GKI's common kernel, not vendor-
      # specific). I could not find an existing, self-contained,
      # verifiable source for this exact behavior to pull in instead, so
      # unlike NTSYNC above, this is original code, not a verified patch.
      # It's also the simplest of everything in this experimental section
      # (one boot-time action, no per-event hot path), so it's the one
      # I'm most confident about — but "most confident" among freshly-
      # written kernel code still means test it before you trust it.
      # Pins every cpufreq policy to max frequency for 60s after boot via
      # a late_initcall + delayed_work, then releases it.
      # ------------------------------------------------------------------
      - name: Add Sandevistan Boot driver (experimental, original code)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          cat > drivers/misc/sandevistan_boot.c << 'SANDEVISTAN_EOF'
          // SPDX-License-Identifier: GPL-2.0-only
          /*
           * sandevistan_boot.c - Pin CPU to max frequency for a fixed window
           * after boot (SuiKernel-inspired "Sandevistan Boot").
           *
           * Written from scratch against generic cpufreq core APIs only.
           * No vendor-specific dependency. Not a copy of any existing driver.
           */

          #include <linux/module.h>
          #include <linux/init.h>
          #include <linux/cpufreq.h>
          #include <linux/workqueue.h>

          #define BOOST_WINDOW_MS 60000

          static struct delayed_work sandevistan_unboost_work;

          static void sandevistan_set_policy_min(unsigned int to_max)
          {
          	struct cpufreq_policy *policy;
          	unsigned int cpu;

          	for_each_possible_cpu(cpu) {
          		policy = cpufreq_cpu_get(cpu);
          		if (!policy)
          			continue;

          		if (policy->cpu == cpu) {
          			policy->user_policy.min = to_max ?
          				policy->cpuinfo.max_freq :
          				policy->cpuinfo.min_freq;
          			cpufreq_update_policy(cpu);
          		}

          		cpufreq_cpu_put(policy);
          	}
          }

          static void sandevistan_unboost_fn(struct work_struct *work)
          {
          	sandevistan_set_policy_min(0);
          	pr_info("sandevistan_boot: boost window ended, policies restored\n");
          }

          static int __init sandevistan_boot_init(void)
          {
          	INIT_DELAYED_WORK(&sandevistan_unboost_work, sandevistan_unboost_fn);

          	sandevistan_set_policy_min(1);
          	schedule_delayed_work(&sandevistan_unboost_work,
          			      msecs_to_jiffies(BOOST_WINDOW_MS));

          	pr_info("sandevistan_boot: pinned CPUs to max freq for %dms\n",
          		BOOST_WINDOW_MS);
          	return 0;
          }
          late_initcall(sandevistan_boot_init);

          MODULE_DESCRIPTION("Pin CPU to max freq for a window after boot (Sandevistan Boot)");
          MODULE_LICENSE("GPL");
          SANDEVISTAN_EOF

          printf '\nconfig SANDEVISTAN_BOOT\n\tbool "Pin CPU to max frequency for 60s after boot (Sandevistan Boot)"\n\tdefault y\n\thelp\n\t  Temporarily pins all cpufreq policies to their maximum frequency\n\t  for 60 seconds after boot, then releases them back to normal.\n' >> drivers/misc/Kconfig
          echo 'obj-$(CONFIG_SANDEVISTAN_BOOT) += sandevistan_boot.o' >> drivers/misc/Makefile

      - name: Enable CONFIG_SANDEVISTAN_BOOT
        run: |
          echo "CONFIG_SANDEVISTAN_BOOT=y" >> kernel_workspace/common/arch/arm64/configs/gki_defconfig

      # ------------------------------------------------------------------
      # NOT ADDED — specific technical reason each, not a blanket "too
      # risky":
      #
      # - Yamada Gaming Boost (the touch-input-boost half of it; the
      #   schedutil rate_limit_us half is already a normal runtime sysfs
      #   tunable, nothing to compile in). Correctly boosting per-touch
      #   across a multi-cluster SoC means either directly poking
      #   policy->min per input event (racy, the older pre-freq_qos style)
      #   or using freq_qos_add_request/freq_qos_update_request per
      #   *unique* policy (the correct modern approach, but needs careful
      #   dedup across CPUs sharing a cluster policy). I'm not confident
      #   enough in getting that exactly right without compiling it — this
      #   sandbox has no network, so I can't pull kernel headers or
      #   actually build-test any of this section myself. Sandevistan Boot
      #   above is one-shot and coarse, so a subtle bug there just means
      #   "doesn't boost" — a per-touch-event driver running continuously
      #   is a different risk profile if the QoS bookkeeping is wrong.
      #
      # - Tenebrion Battery (min freq when screen off): needs a screen-
      #   on/off notification. GKI's common kernel (what this workflow
      #   builds) doesn't include your Helio G99 vendor tree — the DRM
      #   panel driver that would fire that notification lives there, not
      #   here. Whether a generic fbdev-style notifier is even wired up
      #   on your specific vendor kernel isn't something I can verify from
      #   this repo.
      #
      # - Ochinai Inaho Audio (SCHED_FIFO + PM QoS + audioserver thread
      #   boost): this targets a specific Android userspace process
      #   ("audioserver") by name/PID. That process doesn't exist at
      #   kernel-compile time — there's no C code to write for "boost
      #   this daemon once it starts", that's what a service.d script is
      #   *for*. Not a risk call, a category one: kernel source can't
      #   express it.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # FIX: dropped LZ4KD entirely. It is not part of WildKernels'
      # GKI_KernelSU_SUSFS build (their own feature list only lists
      # CUBIC/BIC/Westwood/HTCP/BBR — no LZ4KD), and the repo URL used
      # for it in the uploaded file (WildPlusKernel) doesn't exist. Rather
      # than guess at a replacement source I can't verify, it's removed.
      # If you specifically need LZ4KD zram compression, tell me and I'll
      # look for a genuinely verified source for it separately.
      # ------------------------------------------------------------------

      # ==================================================================
      # NEW: Droidspaces (LXC-like Linux container runtime) support.
      # Source: https://github.com/ravindu644/Droidspaces-OSS
      # android12-5.10 = GKI, kernel "below 6.12" AND "5.10 or lower" —
      # both buckets in their docs, so BOTH kABI patches below are
      # mandatory. Per their own docs this is NOT optional: enabling
      # CONFIG_SYSVIPC / CONFIG_IPC_NS / CONFIG_POSIX_MQUEUE on a GKI
      # kernel without these patches shifts task_struct kABI offsets and
      # will bootloop devices with prebuilt vendor (GPU/camera) modules.
      # ==================================================================
      - name: Clone Droidspaces-OSS kernel patches
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces

      - name: Apply Droidspaces SYSVIPC kABI-safe patch (mandatory, GKI < 6.12)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          PATCH="/tmp/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          if ! patch -p1 --fuzz=3 < "$PATCH"; then
            echo "::error::Droidspaces SYSVIPC kABI patch failed to apply — this is NOT optional. Enabling CONFIG_SYSVIPC without it WILL bootloop devices with prebuilt vendor modules. .rej files:"
            find . -name "*.rej"
            exit 1
          fi

      - name: Apply Droidspaces POSIX_MQUEUE kABI-safe patch (mandatory, kernel 5.10 and below)
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          PATCH="/tmp/droidspaces/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          if ! patch -p1 --fuzz=3 < "$PATCH"; then
            echo "::error::Droidspaces POSIX_MQUEUE kABI patch failed to apply. .rej files:"
            find . -name "*.rej"
            exit 1
          fi

      - name: Set Droidspaces GKI-exclusive kernel configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "# --- Droidspaces (LXC container runtime) support ---"
            echo "CONFIG_SYSVIPC=y"
            echo "CONFIG_POSIX_MQUEUE=y"
            echo "CONFIG_IPC_NS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "# UFW support (optional, recommended)"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "# Fail2ban support (optional, recommended)"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "# tmpfs xattr/posix acl, needed for NixOS containers"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
          } >> gki_defconfig

      # ------------------------------------------------------------------
      # NEW: custom kernel version branding. CONFIG_LOCALVERSION appends
      # the exact "-BLAZE-KSUN-SUSFS-STABLE" suffix, and disabling
      # CONFIG_LOCALVERSION_AUTO stops scripts/setlocalversion from also
      # running `git describe`/`git diff-index` and tacking on its own
      # "-gXXXXXXX" hash or "-dirty" flag on top (the tree IS technically
      # dirty at this point since we've applied patches — this is what
      # actually suppresses that, not just cosmetic naming). Placed last
      # among the defconfig-writing steps so it wins if anything upstream
      # already set these keys (later lines override earlier ones for the
      # same key when the kernel's defconfig loader parses the file).
      # Final uname -r string will read: 5.10.<SUBLEVEL>-BLAZE-KSUN-SUSFS-STABLE
      # ------------------------------------------------------------------
      - name: Set custom kernel version branding
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_LOCALVERSION=\"-${{ env.KERNEL_BRAND }}\""
            echo "# CONFIG_LOCALVERSION_AUTO is not set"
          } >> gki_defconfig

      # ------------------------------------------------------------------
      # FIX: the real, proven way to stop the strict "savedefconfig must
      # match exactly" check — this is what actually causes silent
      # config loss vs. the uploaded file's regenerate-via-savedefconfig
      # approach, which can DROP any of the config lines above if the
      # build system decides they're implied/default (no error shown).
      # SKIP_DEFCONFIG_CHECK=1 (from the uploaded file) does nothing; it
      # isn't a variable the build system reads.
      # ------------------------------------------------------------------
      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      # ------------------------------------------------------------------
      # FIX: android12-5.10 always uses legacy build.sh, never Bazel — the
      # bazel-then-fallback approach in the uploaded file just wastes
      # several minutes failing before falling through, and can leave
      # stray partial-build state that confuses the retry.
      # ------------------------------------------------------------------
      - name: Build kernel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="ci"
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${{ env.CCACHE_DIR }}" \
          build/build.sh -j"$(nproc)"

      - name: Verify kernel version string
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          UTS=$(find out -name "utsrelease.h" | head -n1)
          if [ -n "$UTS" ]; then
            echo "Built version string: $(grep UTS_RELEASE "$UTS")"
          fi

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          if [ -z "$IMG" ]; then
            IMG=$(find out -name "Image" | head -n1)
          fi
          if [ -z "$IMG" ]; then
            echo "::error::No kernel Image found anywhere under kernel_workspace/out — build failed above"
            exit 1
          fi
          echo "Found Image at: $IMG"
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # FIX: WildKernels' own AnyKernel3 fork (gki-2.0 branch), matched to
      # this kernel family, instead of the generic osm0sis upstream — the
      # flasher scripts in this fork already know how to handle a Wild
      # KSU + SUSFS kernel correctly.
      # NEW: kernel.string in anykernel.sh (the name shown on the flash
      # screen) is now overwritten with the same branded name, and the
      # output zip is named after it too, so the label is consistent
      # everywhere — flash screen, zip filename, and `uname -r` on device.
      # ------------------------------------------------------------------
      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          KVER="5.10.${SUBLEVEL}-${{ env.KERNEL_BRAND }}"
          sed -i "s/^kernel\.string=.*/kernel.string=${KVER}/" anykernel.sh
          zip -r9 -q "../${KVER}-${{ github.event.inputs.device_name }}.zip" . -x ".git*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
