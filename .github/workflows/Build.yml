name: Build Custom GKI Kernel (Wild KSU + SUSFS + BBRv3 + Droidspaces + NTSYNC)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Kernel branch tag — 'lts' tracks the rolling LTS branch (recommended)"
        required: true
        default: "lts"
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest on gki-android12-5.10 branch)"
        required: false
        default: ""
      device_name:
        description: "Optional label for artifact naming"
        required: false
        default: "gki-custom"
      enable_bbg:
        description: "Enable Baseband Guard (BBG)"
        required: true
        default: "true"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler rsync libelf-dev dwarves \
            cpio kmod lz4 xz-utils zstd wget

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: mkdir -p "${{ env.CCACHE_DIR }}"

      - name: Resolve manifest branch
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_TAG=""
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_TAG="${INPUT}"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_TAG=${PIN_TAG}" >> "$GITHUB_ENV"

      - name: Sync GKI kernel source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin kernel/common to exact release tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"
          git checkout "refs/tags/${PIN_TAG}"

      - name: Detect kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}" || true
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set SUSFS configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> gki_defconfig

      - name: Copy SUSFS patches
        run: |
          set -euo pipefail
          cd kernel_workspace
          cp susfs4ksu/kernel_patches/include/linux/* common/include/linux/
          cp susfs4ksu/kernel_patches/fs/* common/fs/
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch common/

      - name: Apply pre-patch compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)s+this_lens*=s*min_ts*(s*\u0001s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '/^[[:space:]]*/*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS include
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          for f in fs/statfs.c fs/stat.c fs/open.c fs/namei.c fs/readdir.c; do
            [ -f "$f" ] || continue
            if grep -q 'susfs_' "$f" && ! grep -q '#include <linux/susfs.h>' "$f"; then
              awk '
                BEGIN{last=0}
                /^#include/ { last=NR }
                { lines[NR]=$0 }
                END {
                  for (i=1;i<=NR;i++) {
                    print lines[i]
                    if (i==last) print "#include <linux/susfs.h>"
                  }
                }
              ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done

      - name: Fix SUSFS set_nameidata mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Apply show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' fs/proc/task_mmu.c
          fi

      - name: Setup KernelSU-Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Apply BBRv3 patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          patch -p1 < /tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch
          echo "CONFIG_TCP_CONG_BBR3=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/ntpatches
          if [ -f /tmp/ntpatches/common/ntsync/ntsync_compat_android12-5.10.patch ]; then
            patch -p1 < /tmp/ntpatches/common/ntsync/ntsync_compat_android12-5.10.patch
          fi
          if [ -f /tmp/ntpatches/common/ntsync/ntsync_base.patch ]; then
            patch -p1 < /tmp/ntpatches/common/ntsync/ntsync_base.patch
          fi
          if [ "${SUBLEVEL}" -le "208" ] && [ -f /tmp/ntpatches/common/ntsync/0003-lockdep-assert-none-held.patch ]; then
            patch -p1 < /tmp/ntpatches/common/ntsync/0003-lockdep-assert-none-held.patch
          fi
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Enable Droidspaces configs
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_SYSCTL=y"
            echo "CONFIG_SYSVIPC=y"
            echo "CONFIG_POSIX_MQUEUE=y"
            echo "CONFIG_UTS_NS=y"
            echo "CONFIG_SECCOMP=y"
            echo "CONFIG_SECCOMP_FILTER=y"
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_CGROUP_DEVICE=y"
            echo "CONFIG_CGROUP_PIDS=y"
            echo "CONFIG_MEMCG=y"
            echo "CONFIG_CGROUP_SCHED=y"
            echo "CONFIG_FAIR_GROUP_SCHED=y"
            echo "CONFIG_CGROUP_FREEZER=y"
            echo "CONFIG_CGROUP_NET_PRIO=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
            echo "CONFIG_VETH=y"
            echo "CONFIG_BRIDGE=y"
            echo "CONFIG_NETFILTER=y"
            echo "CONFIG_BRIDGE_NETFILTER=y"
            echo "CONFIG_NETFILTER_ADVANCED=y"
            echo "CONFIG_NF_CONNTRACK=y"
            echo "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_TCPMSS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
          } >> gki_defconfig

      - name: Install BBG
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash

      - name: Enable BBG config
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          echo "CONFIG_BBG=y" >> gki_defconfig

      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Build kernel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="ci"
          export USE_CCACHE=1
          export CCACHE_DIR="${CCACHE_DIR}"
          export CCACHE_COMPRESS=1
          export CCACHE_MAXSIZE=8G
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j"$(nproc)"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "$(find kernel_workspace/out -path '*dist/Image' | head -n1)" ak3/Image
          cd ak3
          zip -r9 "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10.zip" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
