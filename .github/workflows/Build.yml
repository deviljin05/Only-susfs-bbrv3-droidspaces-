name: Build Custom GKI Kernel

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' or exact GKI tag, e.g. android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
        type: string

      susfs_branch:
        description: "Empty = gki-android12-5.10"
        required: false
        default: ""
        type: string

      susfs_commit:
        description: "Empty = latest commit on selected SUSFS branch"
        required: false
        default: ""
        type: string

      ksu_branch:
        description: "Empty = dev-susfs"
        required: false
        default: ""
        type: string

      device_name:
        description: "Artifact name"
        required: true
        default: "gki-custom"
        type: string

      enable_bbg:
        description: "Enable Baseband Guard"
        required: true
        default: false
        type: boolean

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  KSU_SETUP_URL: https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh

jobs:
  build:
    name: Build Custom GKI Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/bin"

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            --connect-timeout 30 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${CCACHE_DIR}"

          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Resolve GKI manifest
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ inputs.os_patch_level }}"

          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_TAG=""
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_TAG="${INPUT}"
          fi

          echo "MANIFEST_REF=${MANIFEST_REF}" >> "${GITHUB_ENV}"
          echo "PIN_TAG=${PIN_TAG}" >> "${GITHUB_ENV}"

          echo "Manifest: ${MANIFEST_REF}"
          echo "Tag: ${PIN_TAG:-not pinned}"

      - name: Sync Android GKI source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel_workspace
          mkdir -p kernel_workspace

          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${MANIFEST_REF}" \
            --depth=1

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Pin kernel/common release tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_NAME="$(git remote | head -n1)"

          if [ -z "${REMOTE_NAME}" ]; then
            echo "::error::No remote found in kernel/common"
            exit 1
          fi

          git fetch \
            --no-tags \
            --depth=1 \
            "${REMOTE_NAME}" \
            "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"

          git checkout --detach "refs/tags/${PIN_TAG}"

      - name: Detect kernel version
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_VERSION="$(make -s kernelversion)"
          SUBLEVEL="$(awk '/^SUBLEVEL =/ {print $3; exit}' Makefile)"

          echo "Kernel version: ${KERNEL_VERSION}"
          echo "Sublevel: ${SUBLEVEL}"

          echo "KERNEL_VERSION=${KERNEL_VERSION}" >> "${GITHUB_ENV}"
          echo "SUBLEVEL=${SUBLEVEL}" >> "${GITHUB_ENV}"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ inputs.susfs_branch }}"

          if [ -z "${BRANCH}" ]; then
            BRANCH="gki-android12-5.10"
          fi

          rm -rf susfs4ksu

          CLONED="false"

          for ATTEMPT in 1 2 3 4 5 6; do
            echo "SUSFS clone attempt ${ATTEMPT}/6"

            if git clone \
              --depth=1 \
              --single-branch \
              --branch "${BRANCH}" \
              "${SUSFS_REPO}" \
              susfs4ksu; then
              CLONED="true"
              break
            fi

            rm -rf susfs4ksu
            sleep $((ATTEMPT * 10))
          done

          if [ "${CLONED}" != "true" ]; then
            echo "::error::SUSFS clone failed after retries"
            exit 1
          fi

          cd susfs4ksu

          COMMIT="${{ inputs.susfs_commit }}"

          if [ -n "${COMMIT}" ]; then
            git fetch --depth=1 origin "${COMMIT}"
            git checkout --detach "${COMMIT}"
          fi

          SUSFS_COMMIT_VALUE="$(git rev-parse HEAD)"

          echo "SUSFS branch: ${BRANCH}"
          echo "SUSFS commit: ${SUSFS_COMMIT_VALUE}"

          echo "SUSFS_COMMIT=${SUSFS_COMMIT_VALUE}" >> "${GITHUB_ENV}"

      - name: Validate SUSFS files
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          ROOT="susfs4ksu/kernel_patches"

          test -d "${ROOT}/fs"
          test -d "${ROOT}/include/linux"
          test -f "${ROOT}/50_add_susfs_in_gki-android12-5.10.patch"

      - name: Copy SUSFS files
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          ROOT="susfs4ksu/kernel_patches"

          cp -a "${ROOT}/fs/." common/fs/
          cp -a "${ROOT}/include/linux/." common/include/linux/

          cp -a \
            "${ROOT}/50_add_susfs_in_gki-android12-5.10.patch" \
            common/50_add_susfs_in_gki-android12-5.10.patch

      - name: Apply Android 12 5.10 compatibility preparation
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL}" -le 43 ]; then
            perl -i -pe \
              's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/' \
              fs/proc/base.c
          fi

          if [ "${SUBLEVEL}" -le 117 ]; then
            sed -i \
              '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' \
              fs/notify/fdinfo.c

            perl -i -pe \
              's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' \
              fs/notify/fdinfo.c

            perl -i -pe \
              's/ignored_mask:%x/ignored_mask:0/g' \
              fs/notify/fdinfo.c
          fi

      - name: Clean patch backup files
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          find . \
            \( -name '*.orig' -o -name '*.rej' \) \
            -type f \
            -delete

      - name: Apply SUSFS patch without orig backups
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=3 \
            -p1 \
            < 50_add_susfs_in_gki-android12-5.10.patch

          REJECTS="$(find . -type f -name '*.rej' | head -n1 || true)"

          if [ -n "${REJECTS}" ]; then
            echo "::error::SUSFS patch generated rejected hunks"
            find . -type f -name '*.rej'
            exit 1
          fi

          find . \
            \( -name '*.orig' -o -name '*.rej' \) \
            -type f \
            -delete

          echo "SUSFS patch applied successfully"

      - name: Fix SUSFS nameidata mismatch
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c

      - name: Apply old sublevel fixes
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL}" -le 209 ]; then
            sed -i \
              's/goto show_pad;/return 0;/' \
              fs/proc/task_mmu.c
          fi

      - name: Validate SUSFS statfs helper
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          FUNC="susfs_sus_kstat_spoof_vfs_statfs"

          if ! grep -Rqs \
            --include='*.c' \
            --include='*.h' \
            "${FUNC}" \
            fs include security drivers; then
            echo "::error::SUSFS statfs helper missing"
            exit 1
          fi

          DECL_FILE="$(
            grep -RIl \
              --include='*.h' \
              "${FUNC}" \
              include fs security drivers 2>/dev/null \
              | head -n1 || true
          )"

          if [ -z "${DECL_FILE}" ]; then
            echo "::error::SUSFS statfs declaration missing"
            exit 1
          fi

          HEADER="${DECL_FILE#./}"
          HEADER="${HEADER#include/}"

          if ! grep -qF "#include <${HEADER}>" fs/statfs.c; then
            sed -i "1i#include <${HEADER}>" fs/statfs.c
          fi

      - name: Setup KernelSU-Next
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          KSU_BRANCH="${{ inputs.ksu_branch }}"

          if [ -z "${KSU_BRANCH}" ]; then
            KSU_BRANCH="dev-susfs"
          fi

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            "${KSU_SETUP_URL}" \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"

      - name: Validate KernelSU
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          test -d drivers/kernelsu

          grep -Rqs "config KSU" drivers/kernelsu || {
            echo "::error::KernelSU Kconfig not found"
            exit 1
          }

      - name: Install Baseband Guard
        if: ${{ inputs.enable_bbg == true }}
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh \
            -o /tmp/baseband-guard-setup.sh

          chmod +x /tmp/baseband-guard-setup.sh
          bash /tmp/baseband-guard-setup.sh

          if [ ! -d common/security/baseband-guard ]; then
            echo "::error::Baseband Guard directory not found"
            find common/security -maxdepth 2 -iname '*baseband*' -print
            exit 1
          fi

          sed -i 's/[[:space:]]-Werror//g' \
            common/security/baseband-guard/Makefile || true

      - name: Configure Baseband Guard LSM
        if: ${{ inputs.enable_bbg == true }}
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          KCONFIG="common/security/Kconfig"

          test -f "${KCONFIG}"
          grep -q "baseband_guard" "${KCONFIG}"

          python3 - "${KCONFIG}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          match = re.search(
              r'config\s+LSM\b.*?(?=\nconfig\s+|\Z)',
              text,
              re.S,
          )

          if not match:
              raise SystemExit("CONFIG_LSM block not found")

          block = match.group(0)

          if "baseband_guard" in block:
              print("baseband_guard already present in CONFIG_LSM")
              raise SystemExit(0)

          patterns = [
              r'(^\s*default\s+["]?)([^"\n]*selinux[^"\n]*)(["]?)',
              r'(^\s*default\s+)(.*selinux.*)$',
          ]

          for pattern in patterns:
              found = re.search(pattern, block, re.M)

              if not found:
                  continue

              old_value = found.group(2)

              new_value = old_value.replace(
                  "selinux",
                  "selinux,baseband_guard",
                  1,
              )

              new_block = (
                  block[:found.start(2)]
                  + new_value
                  + block[found.end(2):]
              )

              path.write_text(text.replace(block, new_block, 1))
              print("baseband_guard added to CONFIG_LSM")
              break
          else:
              raise SystemExit("Could not update CONFIG_LSM")
          PY

      - name: Apply BBRv3 when compatible
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/wildpatches

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          BBR_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ ! -f "${BBR_PATCH}" ]; then
            echo "BBRv3 patch unavailable; regular BBR will be used"
            echo "BBRV3_PATCH_APPLIED=false" >> "${GITHUB_ENV}"
            exit 0
          fi

          if patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < "${BBR_PATCH}"; then
            echo "BBRv3 applied"
            echo "BBRV3_PATCH_APPLIED=true" >> "${GITHUB_ENV}"
          else
            echo "::warning::BBRv3 is incompatible with this GKI tag"
            find . \
              \( -name '*.orig' -o -name '*.rej' \) \
              -type f \
              -delete
            echo "BBRV3_PATCH_APPLIED=false" >> "${GITHUB_ENV}"
          fi

      - name: Apply NTSYNC patches
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "${SUBLEVEL}" -le 208 ]; then
            curl -fL \
              --retry 8 \
              --retry-all-errors \
              -o /tmp/ntsync-lockdep.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch

            patch \
              --no-backup-if-mismatch \
              --batch \
              --forward \
              --fuzz=0 \
              -p1 \
              < /tmp/ntsync-lockdep.patch \
              || echo "::warning::NTSYNC lockdep patch skipped"
          fi

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            -o /tmp/ntsync-compat.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < /tmp/ntsync-compat.patch \
            || echo "::warning::NTSYNC compatibility patch skipped"

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            -o /tmp/ntsync-base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch

          patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < /tmp/ntsync-base.patch \
            || echo "::warning::NTSYNC base patch skipped"

          find . \
            \( -name '*.orig' -o -name '*.rej' \) \
            -type f \
            -delete

      - name: Apply Droidspaces KABI patches
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          DROIDSPACES_OK="true"

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            -o /tmp/droidspaces-sysvipc.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          if ! patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < /tmp/droidspaces-sysvipc.patch; then
            echo "::warning::SYSVIPC patch skipped"
            DROIDSPACES_OK="false"
          fi

          curl -fL \
            --retry 8 \
            --retry-all-errors \
            -o /tmp/droidspaces-mqueue.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

          if ! patch \
            --no-backup-if-mismatch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < /tmp/droidspaces-mqueue.patch; then
            echo "::warning::POSIX_MQUEUE patch skipped"
            DROIDSPACES_OK="false"
          fi

          echo "DROIDSPACES_KABI_OK=${DROIDSPACES_OK}" >> "${GITHUB_ENV}"

          find . \
            \( -name '*.orig' -o -name '*.rej' \) \
            -type f \
            -delete

      - name: Inject kernel configuration
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          TMP="$(mktemp)"

          cat > "${TMP}" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y

          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y

          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_NTSYNC=y

          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF

          if [ "${{ inputs.enable_bbg }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "${TMP}"
          fi

          python3 - "${DEFCONFIG}" "${TMP}" <<'PY'
          from pathlib import Path
          import sys

          target = Path(sys.argv[1])
          additions = Path(sys.argv[2]).read_text().splitlines()

          symbols = {}

          for line in target.read_text().splitlines():
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  symbols[key] = line

          for line in additions:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  symbols[key] = line

          target.write_text(
              "\n".join(symbols.values()) + "\n"
          )
          PY

          rm -f "${TMP}"

      - name: Apply kernel branding
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/setlocalversion ] && \
             [ ! -f scripts/setlocalversion.orig ]; then
            mv scripts/setlocalversion scripts/setlocalversion.orig
          fi

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf '%s\n' '-BLAZE-KSUNv1-STABLE'
          EOF

          chmod +x scripts/setlocalversion

      - name: Disable strict defconfig check
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          if [ -f common/build.config.gki ]; then
            sed -i 's/check_defconfig//' common/build.config.gki
          fi

      - name: Validate source configuration
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          for SYMBOL in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_NAMESPACES \
            CONFIG_NET_NS \
            CONFIG_CGROUPS \
            CONFIG_PID_NS \
            CONFIG_USER_NS; do

            grep -q "^${SYMBOL}=y$" "${DEFCONFIG}" || {
              echo "::error::${SYMBOL} missing from gki_defconfig"
              exit 1
            }
          done

          if [ "${{ inputs.enable_bbg }}" = "true" ]; then
            grep -q '^CONFIG_BBG=y$' "${DEFCONFIG}" || {
              echo "::error::CONFIG_BBG missing from gki_defconfig"
              exit 1
            }
          fi

      - name: Build kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -o pipefail

          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"
          export LLVM=1
          export LLVM_IAS=1

          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${CCACHE_DIR}" \
          build/build.sh -j"$(nproc)" \
            2>&1 | tee /tmp/kernel-build.log

          BUILD_STATUS="${PIPESTATUS[0]}"

          if [ "${BUILD_STATUS}" -ne 0 ]; then
            echo "::error::Kernel build failed"

            grep -B12 -A35 \
              -E 'error:|Error [0-9]+|statfs|baseband|Kconfig' \
              /tmp/kernel-build.log || true

            exit "${BUILD_STATUS}"
          fi

      - name: Verify final configuration
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CFG="$(find out -type f -name .config | head -n1)"

          if [ -z "${CFG}" ]; then
            echo "::error::Final .config not found"
            exit 1
          fi

          for SYMBOL in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_NAMESPACES \
            CONFIG_NET_NS \
            CONFIG_CGROUPS \
            CONFIG_PID_NS \
            CONFIG_USER_NS; do

            grep -q "^${SYMBOL}=y$" "${CFG}" || {
              echo "::error::${SYMBOL} missing from final .config"
              exit 1
            }
          done

          if [ "${{ inputs.enable_bbg }}" = "true" ]; then
            grep -q '^CONFIG_BBG=y$' "${CFG}" || {
              echo "::error::CONFIG_BBG missing from final .config"
              exit 1
            }

            LSM_VALUE="$(grep '^CONFIG_LSM=' "${CFG}" || true)"

            echo "${LSM_VALUE}" | grep -q 'baseband_guard' || {
              echo "::error::baseband_guard missing from CONFIG_LSM"
              echo "${LSM_VALUE}"
              exit 1
            }
          fi

      - name: Locate kernel Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find out -type f \
              \( -path '*/dist/Image' -o -name Image \) \
              | head -n1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "::error::Kernel Image not found"
            find out -maxdepth 7 -type f | head -n200
            exit 1
          fi

          cp "${IMAGE}" "${GITHUB_WORKSPACE}/Image"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ak3

          git clone \
            --depth=1 \
            --branch gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            ak3

          cp Image ak3/Image

          cd ak3

          zip -r9 -q \
            "${GITHUB_WORKSPACE}/${{ inputs.device_name }}-Blaze-android12-5.10-susfs.zip" \
            . \
            -x '.git/*' \
            -x '.gitignore'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name }}-build
          path: |
            *.zip
            Image
          if-no-files-found: error
          retention-days: 14
