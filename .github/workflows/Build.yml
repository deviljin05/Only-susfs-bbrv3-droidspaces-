name: Build Custom GKI Kernel

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "GKI release tag, for example android12-5.10.233_r00"
        required: true
        default: "android12-5.10.264_r00"

      susfs_branch:
        description: "SUSFS branch; leave empty for latest Android 12 5.10 branch"
        required: false
        default: ""

      susfs_commit:
        description: "Optional SUSFS commit; leave empty for latest"
        required: false
        default: ""

      ksu_branch:
        description: "KernelSU-Next branch; leave empty for latest dev-susfs"
        required: false
        default: ""

      device_name:
        description: "Artifact/device label"
        required: true
        default: "gki-custom"

      enable_bbg:
        description: "Enable Baseband Guard only after its integration is confirmed"
        required: true
        default: "false"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  KSU_SETUP_URL: https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

      - name: Configure Git/network
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global protocol.version 2

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/bin"
          curl -fL --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod +x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "${CCACHE_DIR}"
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Resolve GKI manifest
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ github.event.inputs.os_patch_level }}"

          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_TAG=""
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_TAG="${INPUT}"
          fi

          {
            echo "MANIFEST_REF=${MANIFEST_REF}"
            echo "PIN_TAG=${PIN_TAG}"
          } >> "${GITHUB_ENV}"

          echo "MANIFEST_REF=${MANIFEST_REF}"
          echo "PIN_TAG=${PIN_TAG}"

      - name: Sync Android GKI source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${MANIFEST_REF}" \
            --depth=1

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Pin kernel/common release tag
        if: ${{ env.PIN_TAG != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="$(git remote | head -n1)"

          git fetch \
            --no-tags \
            --depth=1 \
            "${REMOTE}" \
            "refs/tags/${PIN_TAG}:refs/tags/${PIN_TAG}"

          git checkout --detach "refs/tags/${PIN_TAG}"

      - name: Detect kernel version
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          VERSION_STRING="$(make -s kernelversion)"
          SUBLEVEL="$(awk '/^SUBLEVEL =/ { print $3; exit }' Makefile)"

          echo "Kernel version: ${VERSION_STRING}"
          echo "Sublevel: ${SUBLEVEL}"

          {
            echo "KERNEL_VERSION=${VERSION_STRING}"
            echo "SUBLEVEL=${SUBLEVEL}"
          } >> "${GITHUB_ENV}"

      - name: Clone SUSFS latest branch
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          PRIMARY="${SUSFS_REPO}"
          BRANCH="${{ github.event.inputs.susfs_branch }}"

          if [ -z "${BRANCH}" ]; then
            BRANCH="gki-android12-5.10"
          fi

          clone_susfs() {
            rm -rf susfs4ksu

            for attempt in 1 2 3 4 5; do
              echo "SUSFS clone attempt ${attempt}: ${BRANCH}"

              if git clone \
                --depth=1 \
                --single-branch \
                --branch "${BRANCH}" \
                "${PRIMARY}" \
                susfs4ksu; then
                return 0
              fi

              rm -rf susfs4ksu
              sleep $((attempt * 8))
            done

            return 1
          }

          if ! clone_susfs; then
            echo "::error::SUSFS clone failed after retries"
            exit 1
          fi

          cd susfs4ksu

          COMMIT="${{ github.event.inputs.susfs_commit }}"

          if [ -n "${COMMIT}" ]; then
            git fetch --depth=1 origin "${COMMIT}"
            git checkout --detach "${COMMIT}"
          fi

          echo "Selected SUSFS commit: $(git rev-parse HEAD)"
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Verify SUSFS layout
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          test -d susfs4ksu/kernel_patches
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch

          test -d susfs4ksu/kernel_patches/fs
          test -d susfs4ksu/kernel_patches/include/linux

          echo "SUSFS layout verified"

      - name: Copy SUSFS files
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          cp -av ../susfs4ksu/kernel_patches/fs/. fs/
          cp -av ../susfs4ksu/kernel_patches/include/linux/. include/linux/
          cp -av \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            ./50_add_susfs_in_gki-android12-5.10.patch

      - name: Apply SUSFS patch strictly
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if patch \
            --batch \
            --forward \
            --fuzz=0 \
            -p1 \
            < 50_add_susfs_in_gki-android12-5.10.patch; then
            echo "SUSFS patch applied cleanly"
          else
            echo "::error::SUSFS patch did not apply cleanly"
            find . -name "*.rej" -o -name "*.orig"
            exit 1
          fi

      - name: Resolve SUSFS statfs helper
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          SYMBOL="susfs_sus_kstat_spoof_vfs_statfs"
          SOURCE="fs/statfs.c"

          if ! grep -Rqs \
            --include='*.c' \
            --include='*.h' \
            "${SYMBOL}" \
            fs include security drivers; then
            echo "::error::${SYMBOL} is absent from SUSFS source"
            exit 1
          fi

          DECL_FILE="$(
            grep -RIl \
              --include='*.h' \
              "${SYMBOL}" \
              include fs security drivers 2>/dev/null | head -n1 || true
          )"

          if [ -z "${DECL_FILE}" ]; then
            echo "::error::No SUSFS header declaration found for ${SYMBOL}"
            grep -Rns "${SYMBOL}" fs include security drivers || true
            exit 1
          fi

          HEADER="${DECL_FILE#./}"
          HEADER="${HEADER#include/}"

          if ! grep -qF "#include <${HEADER}>" "${SOURCE}"; then
            sed -i "1i#include <${HEADER}>" "${SOURCE}"
          fi

          echo "SUSFS statfs declaration: ${DECL_FILE}"
          head -n 12 "${SOURCE}"

      - name: Fix compatible SUSFS nameidata call
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if grep -q \
            'set_nameidata(nd, old_dfd, fake_filename, NULL);' \
            fs/namei.c; then
            sed -i \
              's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
              fs/namei.c
          fi

      - name: Setup KernelSU-Next latest
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.ksu_branch }}" ]; then
            KSU_BRANCH="${{ github.event.inputs.ksu_branch }}"
          else
            KSU_BRANCH="dev-susfs"
          fi

          curl -fL --retry 5 --retry-all-errors \
            "${KSU_SETUP_URL}" \
            -o /tmp/ksu-setup.sh

          chmod +x /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"

      - name: Verify KernelSU source
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          test -d drivers/kernelsu

          grep -Rqs "config KSU" drivers/kernelsu || {
            echo "::error::KernelSU Kconfig was not installed"
            exit 1
          }

          echo "KernelSU source verified"

      - name: Install Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 5 --retry-all-errors \
            https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh \
            -o /tmp/baseband-guard-setup.sh

          chmod +x /tmp/baseband-guard-setup.sh
          bash /tmp/baseband-guard-setup.sh

          test -d common/security/baseband-guard

      - name: Integrate Baseband Guard
        if: ${{ github.event.inputs.enable_bbg == 'true' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          test -f security/Kconfig
          test -d security/baseband-guard

          python3 - security/Kconfig <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          if "baseband_guard" not in text:
              raise SystemExit(
                  "Baseband Guard Kconfig entry is absent from security/Kconfig"
              )

          print("Baseband Guard Kconfig entry found")
          PY

      - name: Apply BBRv3 only when patch exists
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          BBR_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ ! -f "${BBR_PATCH}" ]; then
            echo "::warning::BBRv3 patch not found; keeping normal BBR"
            echo "BBRV3_PATCH_APPLIED=false" >> "${GITHUB_ENV}"
            echo "BBR_CONG_NAME=bbr" >> "${GITHUB_ENV}"
            exit 0
          fi

          if patch --batch --forward --fuzz=0 -p1 < "${BBR_PATCH}"; then
            echo "BBRv3 applied"
            echo "BBRV3_PATCH_APPLIED=true" >> "${GITHUB_ENV}"
          else
            echo "::warning::BBRv3 did not match this GKI source; using normal BBR"
            find . -name "*.rej" -delete
            echo "BBRV3_PATCH_APPLIED=false" >> "${GITHUB_ENV}"
          fi

          echo "BBR_CONG_NAME=bbr" >> "${GITHUB_ENV}"

      - name: Inject deduplicated kernel configuration
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          TMP="$(mktemp)"

          cat > "${TMP}" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_NTSYNC=y
          EOF

          if [ "${{ github.event.inputs.enable_bbg }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "${TMP}"
          fi

          python3 - "${DEFCONFIG}" "${TMP}" <<'PY'
          from pathlib import Path
          import sys

          defconfig = Path(sys.argv[1])
          requested = Path(sys.argv[2]).read_text().splitlines()
          entries = {}

          for line in defconfig.read_text().splitlines():
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  entries[key] = line

          for line in requested:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  entries[key] = line

          defconfig.write_text("\n".join(entries.values()) + "\n")
          PY

          rm -f "${TMP}"

      - name: Validate source before build
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          grep -Rqs \
            "susfs_sus_kstat_spoof_vfs_statfs" \
            fs include security drivers

          grep -q '^CONFIG_KSU_SUSFS_SUS_KSTAT=y$' \
            arch/arm64/configs/gki_defconfig

          if [ "${{ github.event.inputs.enable_bbg }}" = "true" ]; then
            test -d security/baseband-guard
            grep -q '^CONFIG_BBG=y$' \
              arch/arm64/configs/gki_defconfig
          fi

          echo "Source validation passed"

      - name: Build kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -o pipefail

          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="github-actions"
          export LLVM=1
          export LLVM_IAS=1

          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${CCACHE_DIR}" \
          build/build.sh -j"$(nproc)" 2>&1 | tee /tmp/kernel-build.log

          status="${PIPESTATUS[0]}"

          if [ "${status}" -ne 0 ]; then
            echo "::error::Kernel build failed"
            grep -B10 -A30 \
              -E "error:|Error [0-9]+|statfs|baseband" \
              /tmp/kernel-build.log || true
            exit "${status}"
          fi

      - name: Verify final configuration
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CFG="$(find out -type f -name .config | head -n1)"

          if [ -z "${CFG}" ]; then
            echo "::error::Final .config not found"
            exit 1
          fi

          for symbol in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_NAMESPACES \
            CONFIG_NET_NS \
            CONFIG_CGROUPS \
            CONFIG_PID_NS \
            CONFIG_USER_NS; do

            grep -q "^${symbol}=y$" "${CFG}" || {
              echo "::error::${symbol} is not enabled"
              exit 1
            }
          done

          if [ "${{ github.event.inputs.enable_bbg }}" = "true" ]; then
            grep -q '^CONFIG_BBG=y$' "${CFG}" || {
              echo "::error::CONFIG_BBG is not enabled"
              exit 1
            }

            grep '^CONFIG_LSM=' "${CFG}" || {
              echo "::error::CONFIG_LSM is missing"
              exit 1
            }
          fi

      - name: Locate Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find out -type f \
              \( -path '*/dist/Image' -o -name Image \) \
              | head -n1
          )"

          if [ -z "${IMAGE}" ]; then
            echo "::error::Kernel Image not found"
            find out -maxdepth 5 -type f | head -n100
            exit 1
          fi

          cp "${IMAGE}" "${GITHUB_WORKSPACE}/Image"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            ak3

          cp Image ak3/Image

          cd ak3
          zip -r9 -q \
            "${GITHUB_WORKSPACE}/${{ github.event.inputs.device_name }}-android12-5.10-susfs.zip" \
            . \
            -x '.git/*' \
            -x '.gitignore'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: |
            *.zip
            Image
          if-no-files-found: error
          retention-days: 14
